<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <title>Usermanager</title>
    <script src="script.js"></script>
    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.css">
    <link rel="stylesheet" href="node_modules/bootstrap-icons/font/bootstrap-icons.css">
</head>
<body>
<nav class="navbar bg-dark navbar-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="#">User Manager</a>
    </div>
</nav>

<div class="container mb-3">
    <div id="messages"></div>
</div>

<div class="container mb-4">
    <form id="add_user_form">
        <div class="row">
            <div class="col">
                <label for="add_user_given_name" class="d-none">Given Name</label>
                <input type="text" class="form-control" placeholder="Given Name" id="add_user_given_name">
            </div>
            <div class="col">
                <label for="add_user_family_name" class="d-none">Family Name</label>
                <input type="text" class="form-control" placeholder="Family Name" id="add_user_family_name">
            </div>
            <div class="col">
                <label for="add_user_nick_name" class="d-none">Nick Name</label>
                <input type="text" class="form-control" placeholder="Nick Name" id="add_user_nick_name">
            </div>
            <div class="col">
                <button class="btn btn-primary">Add User</button>
            </div>
        </div>
    </form>
</div>
<div class="container">
    <table class="table table-striped table-hover">
        <thead>
        <tr>
            <th>
                ID
            </th>
            <th>
                Given Name
            </th>
            <th>
                Family Name
            </th>
            <th>
                Nick Name
            </th>
            <th>
                Date
            </th>
            <th>
                Actions
            </th>
        </tr>
        </thead>
        <tbody id="user_list">

        </tbody>
    </table>
</div>
<div class="modal fade" id="edit_user_modal">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="edit_user_form">
                <div class="modal-header">
                    <h5 class="modal-title">Edit User</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="edit_user_id">
                    <label for="edit_user_given_name">Given Name</label>
                    <input type="text" class="form-control mb-3" placeholder="Given Name" id="edit_user_given_name">
                    <label for="edit_user_family_name">Family Name</label>
                    <input type="text" class="form-control mb-3" placeholder="Family Name" id="edit_user_family_name">
                    <label for="edit_user_nick_name">Nick Name</label>
                    <input type="text" class="form-control mb-3" placeholder="Nick Name" id="edit_user_nick_name">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button class="btn btn-primary" data-bs-dismiss="modal">Save</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
